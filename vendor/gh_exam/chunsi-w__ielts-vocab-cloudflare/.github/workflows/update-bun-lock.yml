name: Update Bun lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-bun-lockfile
  cancel-in-progress: false

jobs:
  update-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.15

      - name: Regenerate lockfile through an actual install
        run: bun install --ignore-scripts

      - name: Reset installed dependencies
        run: rm -rf node_modules

      - name: Verify the Cloudflare frozen install path
        run: bun install --frozen-lockfile

      - name: Verify the production build
        run: bun run build

      - name: Remove installed dependencies
        run: |
          rm -rf node_modules
          rm -f next-env.d.ts

      - name: Verify scope
        shell: bash
        run: |
          git diff --exit-code -- package.json
          test ! -d node_modules
          git diff --check -- bun.lock
          unexpected_tracked="$(git diff --name-only -- . ':!bun.lock')"
          unexpected_untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$unexpected_tracked" || -n "$unexpected_untracked" ]]; then
            echo "Unexpected tracked files changed:"
            echo "$unexpected_tracked"
            echo "Unexpected untracked files created:"
            echo "$unexpected_untracked"
            exit 1
          fi

      - name: Commit updated lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: regenerate Bun lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
