name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 下载 nltk 数据
        run: |
          python -c "import nltk; [nltk.download(p, quiet=True) for p in ('wordnet','omw-1.4','averaged_perceptron_tagger_eng','punkt','punkt_tab')]"

      - name: 跑测试
        run: pytest -q

      - name: 在合成样例语料上跑通管线
        run: |
          python -m npee_vocab all --corpus-dir examples/sample_corpus --output-dir /tmp/smoke
          python -m npee_vocab compare-modes --corpus-dir examples/sample_corpus
        shell: bash

  # 保证仓库里永远不会混进真题原文
  no-exam-text:
    name: 真题原文泄漏检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: raw/ 与 pdfs/ 必须不存在或被忽略
        run: |
          set -e
          for d in raw pdfs; do
            if [ -d "$d" ]; then
              echo "::error::$d/ 出现在了仓库里——真题原文不得提交。"
              exit 1
            fi
          done
          if git ls-files | grep -Ei '\.pdf$'; then
            echo "::error::仓库里追踪了 PDF 文件——真题原文不得提交。"
            exit 1
          fi
          echo "OK：未发现真题原文。"
